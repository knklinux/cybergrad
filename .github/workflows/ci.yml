name: CI

# ── Por qué checkout@v5 / setup-node@v5 / gitleaks-action@v3 ────────────
# GitHub deprecó Node.js 20 en los runners (sept. 2025): las actions que
# apuntaban a Node 20 se veían forzadas a correr en Node 24 con warnings de
# deprecación en cada run. Subimos a las primeras versiones con runtime
# Node 24 (checkout/setup-node v4→v5, gitleaks v2→v3); no cambian inputs ni
# comportamiento, solo el runtime, así que la migración es de una línea.
#
# Nota: el job `build` del deploy de GitHub Pages sigue mostrando una
# warning de Node 20 — pero ese workflow lo gestiona GitHub internamente
# (usa checkout@v4 y upload-artifact@v4 por dentro; no viven en este repo,
# por eso no se pueden actualizar aquí). La warning desaparecerá sola
# cuando GitHub migre su workflow interno de Pages al runtime Node 24;
# no requiere ninguna acción por nuestra parte.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Sintaxis (node --check sobre todos los .js)
        run: npm run check

      - name: Linter básico (ESLint)
        run: npm run lint

      - name: Instalar navegador Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Test unitario esc() — escape HTML (XSS)
        run: npm run test:unit

      - name: Test serve.js (URL malformada → 400 sin caerse)
        run: npm run test:serve

      - name: Smoke test (carga sin errores de consola)
        run: npm run test:smoke

      - name: Test XSS E2E (nombre malicioso nunca se ejecuta)
        run: npm run test:xss

      - name: Test whoami E2E (SOC vs Red Team)
        run: npm run test:whoami

      - name: Test banner (CYBERGRAD completo y sin glifos de otra letra)
        run: npm run test:banner

      - name: Test banner del README (coincide EXACTO con el de js/main.js, con mutación)
        run: npm run test:readme-banner

      - name: Test artefactos visuales (subtítulo, pie, separador ASCII y rangos del tutorial)
        run: npm run test:visual

      - name: Test metadatos (título de pestaña + Open Graph + Twitter Card con mutaciones)
        run: npm run test:meta

      - name: Test _headers en host compatible (CDN local aplica la CSP como cabecera HTTP real)
        run: npm run test:headers

      - name: Test reto diario (variación por semilla + modo sin pistas)
        run: npm run test:reto

      - name: Test modo examen + certificado PNG y PDF
        run: npm run test:examen

      - name: Test Jimmy-IA (preguntas libres sobre el caso)
        run: npm run test:jimmy-ia

      - name: Test easter egg del nombre (porque_cybergrad oculto + Jimmy)
        run: npm run test:easteregg

      - name: Test voz (reconocimiento del navegador con mock, degradación sin API)
        run: npm run test:voz

      - name: "Test voz local de Jimmy (Piper TTS: funciones puras + E2E con servidor simulado)"
        run: npm run test:piper

      - name: Test modo presentador (demo sin persistir)
        run: npm run test:presentador

      - name: Test sonido (toggle persistido, sin errores de consola)
        run: npm run test:sonido

      - name: Test árbol de habilidades MITRE (integridad de datos + panel)
        run: npm run test:habilidades

      - name: "Test ataque adaptativo (pivote: si no contienes a tiempo, el caso se complica)"
        run: npm run test:pivot

      - name: Test quiz de repaso MITRE (estructura de los 15 casos + E2E completando el caso-01)
        run: npm run test:quiz

      - name: Test duelo SOC vs Red Team (turnos alternos + E2E con duelo completo)
        run: npm run test:duelo

      - name: Test PWA (manifest instalable + service worker con modo offline real)
        run: npm run test:pwa

      - name: "PWA al día (build:pwa regenera sw.js, iconos y el .ico del escritorio; git diff debe estar vacío)"
        run: |
          npm run build:pwa
          git diff --exit-code -- sw.js assets/icon-192.png assets/icon-512.png assets/cybergrad.ico

  # Check de integración real: verifica que lo DESPLEGADO en GitHub Pages
  # sirve los artefactos visuales correctos (banner, subtítulo y separador;
  # mismos canónicos que los tests locales). Solo corre en push a main y
  # manualmente (workflow_dispatch): en un PR la URL de producción no
  # refleja el código del PR, así que no tendría sentido. El propio test
  # reintenta hasta 5 min por si el deploy de Pages aún está en curso
  # cuando arranca el job.
  integracion:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Test E2E en la version desplegada (banner, subtitulo, pie y separador)
        run: npm run test:prod

      - name: "Check README desplegado en GitHub (banner intacto vía API application/vnd.github.html)"
        run: npm run test:readme-prod
        env:
          # Evita el rate limit anónimo de api.github.com (el token de Actions
          # tiene 1000 req/h; sin él, 60/h por IP compartida y el check sería flaky).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Check vista móvil del README (banner intacto a 375px: scroll, nunca wrap)"
        run: npm run test:readme-mobile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Historial completo: gitleaks detect escanea TODOS los commits,
          # no solo el último (caza secretos ya subidos en el pasado).
          fetch-depth: 0
      # v3 = migración Node 20 → Node 24 (sin cambios de inputs ni comportamiento).
      - uses: gitleaks/gitleaks-action@v3
        env:
          # Token automático del runner: no hace falta crear ninguno.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
