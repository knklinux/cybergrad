name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Sintaxis (node --check sobre todos los .js)
        run: npm run check

      - name: Linter básico (ESLint)
        run: npm run lint

      - name: Instalar navegador Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Test unitario esc() — escape HTML (XSS)
        run: npm run test:unit

      - name: Test serve.js (URL malformada → 400 sin caerse)
        run: npm run test:serve

      - name: Smoke test (carga sin errores de consola)
        run: npm run test:smoke

      - name: Test XSS E2E (nombre malicioso nunca se ejecuta)
        run: npm run test:xss

      - name: Test whoami E2E (SOC vs Red Team)
        run: npm run test:whoami

      - name: Test banner (CYBERGRAD completo y sin glifos de otra letra)
        run: npm run test:banner

      - name: Test artefactos visuales (subtítulo, pie, separador ASCII y rangos del tutorial)
        run: npm run test:visual

      - name: Test metadatos (título de pestaña + Open Graph + Twitter Card con mutaciones)
        run: npm run test:meta

      - name: Test reto diario (variación por semilla + modo sin pistas)
        run: npm run test:reto

      - name: Test modo examen + certificado PNG y PDF
        run: npm run test:examen

      - name: Test Jimmy-IA (preguntas libres sobre el caso)
        run: npm run test:jimmy-ia

      - name: Test voz (reconocimiento del navegador con mock, degradación sin API)
        run: npm run test:voz

      - name: Test modo presentador (demo sin persistir)
        run: npm run test:presentador

      - name: Test sonido (toggle persistido, sin errores de consola)
        run: npm run test:sonido

      - name: Test árbol de habilidades MITRE (integridad de datos + panel)
        run: npm run test:habilidades

  # Check de integración real: verifica que lo DESPLEGADO en GitHub Pages
  # sirve los artefactos visuales correctos (banner, subtítulo y separador;
  # mismos canónicos que los tests locales). Solo corre en push a main y
  # manualmente (workflow_dispatch): en un PR la URL de producción no
  # refleja el código del PR, así que no tendría sentido. El propio test
  # reintenta hasta 5 min por si el deploy de Pages aún está en curso
  # cuando arranca el job.
  integracion:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Test E2E en la version desplegada (banner, subtitulo, pie y separador)
        run: npm run test:prod

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: gitleaks detect escanea TODOS los commits,
          # no solo el último (caza secretos ya subidos en el pasado).
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          # Token automático del runner: no hace falta crear ninguno.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
